name: Tests

# The README badge shows the latest run on main. A pull-request run does not
# count, so this push is what keeps the badge current after each merge.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

# Least privilege: these jobs only read the repo and run build/lint/test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Exactly the versions `engines.node` promises, so every runtime the
        # published plugin claims to support is one CI has run. Node 20 was
        # dropped when it went end-of-life: Homebridge 2 requires ^22 || ^24 ||
        # ^26, so promising 20 promised a runtime the host cannot start on.
        node-version: [22.x, 24.x, 26.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    # dist/ is committed (so git installs work); fail if it drifted from src/ or
    # if the build produced untracked files under dist/ that were not committed.
    - name: Verify committed dist is in sync with src
      run: |
        if [ -n "$(git status --porcelain -- dist)" ]; then
          echo "dist/ is dirty or has untracked files after build:"
          git status --porcelain -- dist
          exit 1
        fi
        git diff --exit-code -- dist

    # The build above only typechecks `src/`. This adds the test project, whose
    # strictness is what keeps the doubles honest about the real contracts.
    - name: Typecheck
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: matrix.node-version == '22.x'
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    - name: Run npm audit
      run: npm audit --omit=dev --audit-level=moderate
