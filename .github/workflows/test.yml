name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repo and run build/lint/test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20.x is the floor `engines.node` promises, reachable through Homebridge
        # 1.6. `npm ci` warns EBADENGINE there because the *dev* dependency
        # homebridge 2.x wants ^22 || ^24; that is expected and is not a reason
        # to drop the 20.x job, which is what proves the published plugin runs
        # on the version it claims to support.
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    # dist/ is committed (so git installs work); fail if it drifted from src/ or
    # if the build produced untracked files under dist/ that were not committed.
    - name: Verify committed dist is in sync with src
      run: |
        if [ -n "$(git status --porcelain -- dist)" ]; then
          echo "dist/ is dirty or has untracked files after build:"
          git status --porcelain -- dist
          exit 1
        fi
        git diff --exit-code -- dist

    # The build above only typechecks `src/`. This adds the test project, whose
    # strictness is what keeps the doubles honest about the real contracts.
    - name: Typecheck
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: matrix.node-version == '20.x'
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    - name: Run npm audit
      run: npm audit --omit=dev --audit-level=moderate
