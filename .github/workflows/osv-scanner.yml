# Vulnerability scanning with OSV-Scanner.
#
# OSV-Scanner is a Google tool, not a GitHub-certified action, and is governed
# by its own terms of service and privacy policy. It is pinned to a commit SHA
# for the same reason every other action in this repository is: a tag can be
# re-pointed by its upstream, and this workflow holds `security-events: write`.
#
# Runs on pull requests and merge queues (fail on newly introduced advisories),
# on every push to main, and weekly. The main scan uploads SARIF to the default
# branch, so fixed alerts close on merge instead of waiting for the next weekly run.
# The weekly run still catches an advisory published against an unchanged dependency.

name: OSV-Scanner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '22 4 * * 1'
  workflow_dispatch:

# Least privilege at the workflow level; each job opts into what it needs.
permissions: {}

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      # Uploading a SARIF file to the security tab needs both of these.
      # See https://github.com/github/codeql-action/issues/2117
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # v2.6.0 dropped --skip-git. Git roots are skipped unless --include-git-root is set, so the scan stays on declared dependencies rather than commit history.
      scan-args: |-
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        -r
        ./
